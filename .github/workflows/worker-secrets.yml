name: Worker Secrets

# Lists the NAMES of the secrets set on the Worker -- never their values,
# which Cloudflare does not hand back to anyone.  For answering "is it set?"
# after a secret is added in the dashboard, without a terminal.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: List secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler secret list --format pretty || npx --yes wrangler secret list
