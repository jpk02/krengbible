name: VOTD Topics

# How each photo search topic has fared with the picker:  kept against
# blocked, and the share of the board's draws each now gets.  Runs the
# worker's own weighting code (scripts/votd-topics.js) over the records in KV.
#
# READ-ONLY.  Topic names and counts only.  The lines are emitted as
# ::notice:: annotations in packed groups, since GitHub keeps only ten
# annotations a step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi

      - name: Read
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          get() { npx --yes wrangler kv key get --binding=COMMENTARY_KV "$1" --remote 2>/dev/null || true; }
          mkdir -p "$RUNNER_TEMP/kv"
          get votd_used     > "$RUNNER_TEMP/kv/used.json"
          get votd_rejected > "$RUNNER_TEMP/kv/rejected.json"
          get votd_queue    > "$RUNNER_TEMP/kv/queue.json"
          get votd_archive  > "$RUNNER_TEMP/kv/archive.json"
          node ../scripts/votd-topics.js "$RUNNER_TEMP/kv" > "$RUNNER_TEMP/out.txt"
          cat "$RUNNER_TEMP/out.txt"
          # Five lines to an annotation, joined with " || ".
          awk 'BEGIN{n=0;buf=""} {buf = buf (n%5 ? " || " : "") $0; n++; if (n%5==0) {print "::notice::" buf; buf=""}} END{if (buf!="") print "::notice::" buf}' "$RUNNER_TEMP/out.txt"
          { echo '## VOTD topics'; echo; echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
