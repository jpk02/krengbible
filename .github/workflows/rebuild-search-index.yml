name: Rebuild Korean Search Index

# Rebuilds one Korean translation's search index from the chapters already in
# KV:  the five /admin/build-index chunks of 250 chapters, then
# /admin/merge-index -- the runbook in worker/README.md, without a terminal.
# Needed after a change to how a translation's text is cleaned (우리말's 웻
# fix, for one), since the index holds the text as it was when built.
#
# Uses the repository secret ADMIN_SECRET, which GitHub fills in on its own
# servers:  the value never appears in this file, the run log or a chat.
#
# Deliberately no `pull_request:` trigger.  This repo is public, and a fork PR
# must never get a run that can read ADMIN_SECRET.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Which translation'
        required: true
        default: 'WOORI'
        type: choice
        options: [WOORI, NKRV, SAEBEON]

permissions:
  contents: read

concurrency:
  group: rebuild-search-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secret
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::Repository secret ADMIN_SECRET is not set.  Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Build and merge
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          V: ${{ inputs.version }}
        run: |
          base="https://krengbible.pauljkim22.workers.dev"
          call() {
            # The secret goes in the query because that is where the worker
            # reads it;  curl prints no URL, and GitHub masks the value anyway.
            local path="$1"
            local code
            code=$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}' --max-time 600 \
              "$base$path&v=$V&secret=$ADMIN_SECRET")
            echo "$path -> HTTP $code: $(head -c 400 "$RUNNER_TEMP/body.json")"
            if [ "$code" != "200" ]; then
              echo "::error::$path failed with HTTP $code"
              exit 1
            fi
          }
          for from in 0 250 500 750 1000; do
            call "/admin/build-index?from=$from&size=250"
          done
          call "/admin/merge-index?x=1"
          echo "::notice::$V search index rebuilt."
