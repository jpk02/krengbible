<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Game</title>
<meta name="description" content="A 4x4 memory game.  Flip two cards;  a matching pair stays face up.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1eb;
    --ink: #1a1a1a;
    --dim: #6b6660;
    --face: #ffffff;
    --face-edge: #e3ddd2;
    --back: #1b2a4a;
    --back-edge: #2c3f66;
    --back-mark: rgba(255, 255, 255, 0.14);
    --accent: #1b2a4a;
    --accent-ink: #ffffff;
    --found: #2f8f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --ink: #eeeeee;
      --dim: #9a948c;
      --face: #2a2a2a;
      --face-edge: #3a3a3a;
      --back: #34466e;
      --back-edge: #4a5d88;
      --back-mark: rgba(255, 255, 255, 0.16);
      --accent: #e9e4da;
      --accent-ink: #1a1a1a;
      --found: #5cc47f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 28px; line-height: 34px; margin: 0 0 4px; letter-spacing: -0.3px; }
  .lede { color: var(--dim); font-size: 15px; margin: 0 0 20px; }

  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--dim);
  }
  .bar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar .spacer { flex: 1; }
  button.new {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }
  button.new:focus-visible { outline: 3px solid var(--found); outline-offset: 2px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  /* A card is a button with two faces, turned by rotating the inner layer. */
  .card {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    perspective: 700px;
    -webkit-tap-highlight-color: transparent;
  }
  .card:focus-visible { outline: 3px solid var(--found); outline-offset: 3px; border-radius: 14px; }
  .inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.38s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .card.up .inner { transform: rotateY(180deg); }
  .side {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back {
    background: var(--back);
    border: 1px solid var(--back-edge);
    background-image:
      radial-gradient(circle at 50% 50%, var(--back-mark) 0 18%, transparent 19%),
      radial-gradient(circle at 50% 50%, transparent 0 30%, var(--back-mark) 31% 33%, transparent 34%);
  }
  .front {
    background: var(--face);
    border: 1px solid var(--face-edge);
    transform: rotateY(180deg);
  }
  .front svg { width: 62%; height: 62%; }
  .card.found .front { border-color: var(--found); box-shadow: inset 0 0 0 2px var(--found); }
  .card.found { cursor: default; }

  .win {
    margin-top: 18px;
    text-align: center;
    font-size: 16px;
    min-height: 24px;
  }
  .win strong { color: var(--found); }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Memory Game</h1>
  <p class="lede">Flip two cards.  A matching pair stays face up;  anything else turns back over.</p>

  <div class="bar" aria-live="polite">
    <span>Moves <strong id="moves">0</strong></span>
    <span>Pairs <strong id="pairs">0</strong> / 8</span>
    <span class="spacer"></span>
    <button type="button" class="new" id="new">New Game</button>
  </div>

  <div class="grid" id="grid" role="grid" aria-label="Memory cards"></div>
  <p class="win" id="win" aria-live="polite"></p>
</main>

<script>
(() => {
  // Twelve objects, drawn rather than typed, so every device shows the same
  // picture.  Each game picks eight of them at random.
  const OBJECTS = [
    { name: 'Heart', svg: '<path fill="#e0445a" d="M12 21s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.6 12 21 12 21z"/>' },
    { name: 'Star', svg: '<path fill="#f2b631" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z"/>' },
    { name: 'Moon', svg: '<path fill="#6b6fd6" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>' },
    { name: 'Sun', svg: '<g stroke="#f08c2a" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g><circle cx="12" cy="12" r="4.6" fill="#f08c2a"/>' },
    { name: 'Leaf', svg: '<path fill="#3f9a4f" d="M5 19C5 11 10 5 20 4c0 10-6 15-15 15z"/><path d="M5 19l9-9" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>' },
    { name: 'Fish', svg: '<path fill="#1f9aa8" d="M2.5 12c3-5 9.5-6.2 13.5-2l5.5-3.5v11L16 14c-4 4.2-10.5 3-13.5-2z"/><circle cx="8" cy="11" r="1.2" fill="#ffffff"/>' },
    { name: 'Key', svg: '<g fill="none" stroke="#b07a2c" stroke-width="2.2" stroke-linecap="round"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M17.5 12v3.2M20.5 12v2.4"/></g>' },
    { name: 'Bell', svg: '<path fill="#d9a21b" d="M6 16v-4.8a6 6 0 0 1 12 0V16l2 2H4z"/><circle cx="12" cy="20.2" r="1.7" fill="#d9a21b"/>' },
    { name: 'Drop', svg: '<path fill="#2f7fd8" d="M12 2.8s6.2 7 6.2 11.2a6.2 6.2 0 0 1-12.4 0C5.8 9.8 12 2.8 12 2.8z"/>' },
    { name: 'Flower', svg: '<g fill="#e46fa8"><circle cx="12" cy="6.6" r="3.3"/><circle cx="17.1" cy="10.3" r="3.3"/><circle cx="15.2" cy="16.3" r="3.3"/><circle cx="8.8" cy="16.3" r="3.3"/><circle cx="6.9" cy="10.3" r="3.3"/></g><circle cx="12" cy="12" r="2.6" fill="#f5c542"/>' },
    { name: 'Cloud', svg: '<path fill="#7fb4e6" d="M7 18.5a4.2 4.2 0 0 1-.6-8.4A6 6 0 0 1 18 9.2a4.7 4.7 0 0 1 .3 9.3z"/>' },
    { name: 'Anchor', svg: '<g fill="none" stroke="#2c4a7a" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="4.8" r="2"/><path d="M12 6.8V20.5M8 10.5h8M4.8 13.6a7.2 7.2 0 0 0 14.4 0"/></g>' },
  ];
  const PAIRS = 8;
  const MISMATCH_MS = 850;

  const grid = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const winEl = document.getElementById('win');

  let deck = [];
  let first = null;
  let second = null;
  let locked = false;
  let moves = 0;
  let found = 0;

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newGame() {
    const chosen = shuffle(OBJECTS).slice(0, PAIRS);
    deck = shuffle(chosen.concat(chosen)).map((obj, i) => ({ obj, i, up: false, found: false }));
    first = second = null;
    locked = false;
    moves = 0;
    found = 0;
    movesEl.textContent = '0';
    pairsEl.textContent = '0';
    winEl.textContent = '';
    grid.innerHTML = '';
    deck.forEach((card) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'card';
      el.setAttribute('aria-label', 'Face-down card');
      el.innerHTML =
        '<span class="inner">' +
          '<span class="side back"></span>' +
          '<span class="side front"><svg viewBox="0 0 24 24" aria-hidden="true">' + card.obj.svg + '</svg></span>' +
        '</span>';
      el.addEventListener('click', () => flip(card));
      card.el = el;
      grid.appendChild(el);
    });
  }

  function show(card, up) {
    card.up = up;
    card.el.classList.toggle('up', up);
    card.el.setAttribute('aria-label', up ? card.obj.name : 'Face-down card');
  }

  function flip(card) {
    if (locked || card.up || card.found) return;
    show(card, true);
    if (!first) {
      first = card;
      return;
    }
    second = card;
    moves += 1;
    movesEl.textContent = String(moves);

    if (first.obj === second.obj) {
      // A match stays face up for the rest of the game.
      [first, second].forEach((c) => {
        c.found = true;
        c.el.classList.add('found');
        c.el.setAttribute('aria-label', c.obj.name + ', matched');
      });
      found += 1;
      pairsEl.textContent = String(found);
      first = second = null;
      if (found === PAIRS) {
        winEl.innerHTML = '<strong>All pairs found</strong> in ' + moves + ' moves.';
      }
      return;
    }

    // Not a match:  leave both showing long enough to remember, then turn
    // them back over.  No other card can be flipped in the meantime.
    locked = true;
    const a = first;
    const b = second;
    setTimeout(() => {
      show(a, false);
      show(b, false);
      first = second = null;
      locked = false;
    }, MISMATCH_MS);
  }

  document.getElementById('new').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
