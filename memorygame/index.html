<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Game</title>
<meta name="description" content="A 4x4 memory game.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1eb;
    --ink: #1a1a1a;
    --dim: #6b6660;
    --face: #ffffff;
    --face-edge: #e3ddd2;
    --back: #1b2a4a;
    --back-edge: #2c3f66;
    --back-mark: rgba(255, 255, 255, 0.14);
    --accent: #1b2a4a;
    --accent-ink: #ffffff;
    --found: #2f8f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --ink: #eeeeee;
      --dim: #9a948c;
      --face: #2a2a2a;
      --face-edge: #3a3a3a;
      --back: #34466e;
      --back-edge: #4a5d88;
      --back-mark: rgba(255, 255, 255, 0.16);
      --accent: #e9e4da;
      --accent-ink: #1a1a1a;
      --found: #5cc47f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 28px; line-height: 34px; margin: 0 0 18px; letter-spacing: -0.3px; }

  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--dim);
  }
  .bar strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar .spacer { flex: 1; }
  button.new {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }
  button.new:focus-visible { outline: 3px solid var(--found); outline-offset: 2px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  /* A card is a button with two faces, turned by rotating the inner layer. */
  .card {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    perspective: 700px;
    -webkit-tap-highlight-color: transparent;
  }
  .card:focus-visible { outline: 3px solid var(--found); outline-offset: 3px; border-radius: 14px; }
  .inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.38s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .card.up .inner { transform: rotateY(180deg); }
  .side {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back {
    background: var(--back);
    border: 1px solid var(--back-edge);
    background-image:
      radial-gradient(circle at 50% 50%, var(--back-mark) 0 18%, transparent 19%),
      radial-gradient(circle at 50% 50%, transparent 0 30%, var(--back-mark) 31% 33%, transparent 34%);
  }
  .front {
    background: var(--face);
    border: 1px solid var(--face-edge);
    transform: rotateY(180deg);
  }
  /* The picture is the device's own colour emoji, drawn at card size:  on an
     iPhone or a Mac that is Apple's glossy 3D set.  A soft shadow lifts it off
     the card;  it pops in as the card turns and bounces when it is matched. */
  .front { container-type: size; }
  .pic {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    font-size: 58cqh;
    line-height: 1;
    filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.22));
    transform: scale(0.55);
    transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) 0.14s;
  }
  .card.up .pic { transform: scale(1); }
  .card.found .pic { animation: bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.22) rotate(-6deg); }
    70% { transform: scale(0.94) rotate(3deg); }
    100% { transform: scale(1); }
  }
  .card.found .front { border-color: var(--found); box-shadow: inset 0 0 0 2px var(--found); }
  .card.found { cursor: default; }

  .win {
    margin-top: 18px;
    text-align: center;
    font-size: 16px;
    min-height: 24px;
  }
  .win strong { color: var(--found); }

  @media (prefers-reduced-motion: reduce) {
    .inner, .pic { transition: none; }
    .card.found .pic { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Memory Game</h1>

  <div class="bar" aria-live="polite">
    <span>Pairs <strong id="pairs">0</strong> / 8</span>
    <span class="spacer"></span>
    <button type="button" class="new" id="new">New Game</button>
  </div>

  <div class="grid" id="grid" role="grid" aria-label="Memory cards"></div>
  <p class="win" id="win" aria-live="polite"></p>
</main>

<script>
(() => {
  // Sixteen objects;  each game picks eight.  Code points rather than the
  // characters themselves, so this file stays plain ASCII.
  const OBJECTS = [
    { name: 'Apple', pic: '\u{1F34E}' },
    { name: 'Watermelon', pic: '\u{1F349}' },
    { name: 'Pineapple', pic: '\u{1F34D}' },
    { name: 'Strawberry', pic: '\u{1F353}' },
    { name: 'Sunflower', pic: '\u{1F33B}' },
    { name: 'Cactus', pic: '\u{1F335}' },
    { name: 'Rocket', pic: '\u{1F680}' },
    { name: 'Hot air balloon', pic: '\u{1F388}' },
    { name: 'Soccer ball', pic: '\u{26BD}\u{FE0F}' },
    { name: 'Guitar', pic: '\u{1F3B8}' },
    { name: 'Butterfly', pic: '\u{1F98B}' },
    { name: 'Dolphin', pic: '\u{1F42C}' },
    { name: 'Turtle', pic: '\u{1F422}' },
    { name: 'Lion', pic: '\u{1F981}' },
    { name: 'Rainbow', pic: '\u{1F308}' },
    { name: 'Crown', pic: '\u{1F451}' },
  ];
  const PAIRS = 8;
  const MISMATCH_MS = 850;

  const grid = document.getElementById('grid');
  const pairsEl = document.getElementById('pairs');
  const winEl = document.getElementById('win');

  let deck = [];
  let first = null;
  let second = null;
  let locked = false;
  let found = 0;

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newGame() {
    const chosen = shuffle(OBJECTS).slice(0, PAIRS);
    deck = shuffle(chosen.concat(chosen)).map((obj, i) => ({ obj, i, up: false, found: false }));
    first = second = null;
    locked = false;
    found = 0;
    pairsEl.textContent = '0';
    winEl.textContent = '';
    grid.innerHTML = '';
    deck.forEach((card) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'card';
      el.setAttribute('aria-label', 'Face-down card');
      el.innerHTML =
        '<span class="inner">' +
          '<span class="side back"></span>' +
          '<span class="side front"><span class="pic" aria-hidden="true">' + card.obj.pic + '</span></span>' +
        '</span>';
      el.addEventListener('click', () => flip(card));
      card.el = el;
      grid.appendChild(el);
    });
  }

  function show(card, up) {
    card.up = up;
    card.el.classList.toggle('up', up);
    card.el.setAttribute('aria-label', up ? card.obj.name : 'Face-down card');
  }

  function flip(card) {
    if (locked || card.up || card.found) return;
    show(card, true);
    if (!first) {
      first = card;
      return;
    }
    second = card;

    if (first.obj === second.obj) {
      // A match stays face up for the rest of the game.
      [first, second].forEach((c) => {
        c.found = true;
        c.el.classList.add('found');
        c.el.setAttribute('aria-label', c.obj.name + ', matched');
      });
      found += 1;
      pairsEl.textContent = String(found);
      first = second = null;
      if (found === PAIRS) {
        winEl.innerHTML = '<strong>All pairs found.</strong>';
      }
      return;
    }

    // Not a match:  leave both showing long enough to remember, then turn
    // them back over.  No other card can be flipped in the meantime.
    locked = true;
    const a = first;
    const b = second;
    setTimeout(() => {
      show(a, false);
      show(b, false);
      first = second = null;
      locked = false;
    }, MISMATCH_MS);
  }

  document.getElementById('new').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
