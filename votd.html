<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>VOTD picker</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" sizes="16x16">
<link rel="icon" href="/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--
  Unlisted admin page for choosing Verse-of-the-Day photos.

  Not linked from anywhere on the site and excluded from indexing, but that is
  obscurity, not security — the actual gate is ADMIN_SECRET, which every API
  call carries in an X-Admin-Secret header (never a query param, so it stays
  out of URLs and access logs).  The secret is held in localStorage on this
  device only; nothing here is served by the worker, so a visitor without the
  secret gets an empty shell and a 403.
-->
<style>
  :root{
    --bg:#f6f7f8; --panel:#fff; --line:#e3e6e9; --ink:#14181c; --dim:#6b7480;
    --accent:#14181c; --danger:#b3261e; --ok:#1c6b3f;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#111417; --panel:#181c20; --line:#272c31; --ink:#e9edf1; --dim:#9aa4ae; --accent:#e9edf1; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;font-weight:640;letter-spacing:-.01em}
  .stats{font-size:13px;color:var(--dim)}
  .wrap{padding:22px}
  /* Two tabs, one thing on screen at a time:  the board for picking, or the
     three things worth reviewing (today, tomorrow, the queue).  Side by side
     the review column was 300px and its tiles too small to judge a photo. */
  .tabs{display:flex;gap:6px;padding:10px 22px 0}
  .tabs button{border-radius:999px;padding:7px 14px}
  .tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  /* THE SHAPE THE APP ACTUALLY SHOWS.
   *
   * VotdCard renders the photo into a card that is `width: 100%, maxWidth: 420,
   * minHeight: 420` with contentFit="cover" — so on a typical phone it is about
   * 353 wide by 420 tall and the image is CROPPED to that, not letterboxed.
   * Previewing at 3/2 was showing a landscape strip of a portrait crop: the
   * top and bottom of every photo were invisible here and the sides were
   * missing there, which is exactly backwards for choosing one.
   *
   * WHY THIS EXACT RATIO, AND WHY THERE IS NO SINGLE RIGHT ONE.
   *
   * The card is `min(screenWidth - 40, 420)` wide by `max(420, content)` tall,
   * so the crop depends on the phone: about 0.80 on an SE, 0.93 on a Pro Max.
   * 362/420 is an iPhone 16 Pro (402pt wide, less the 20pt page padding on each
   * side), which is what this was checked against.  Nudge it if the reference
   * device changes;  every preview here follows this one value.
   *
   * The height moves too — the card grows past 420 when a verse runs long — so
   * a preview can be close but never exact.  Close is the point: it exists to
   * stop a photo being chosen whose subject the crop cuts through. */
  :root{--votd-crop:362/420}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        display:flex;flex-direction:column;transition:opacity .18s,transform .18s}
  .card.busy{opacity:.35;transform:scale(.98);pointer-events:none}
  .card img{width:100%;aspect-ratio:var(--votd-crop);object-fit:cover;display:block;background:var(--line)}

  /* A sample verse over every preview, laid out as VotdCard lays it out.
   *
   * A bare photo answers "is this a nice photo";  the card answers "can the
   * verse be read over it", which is the question that actually decides a
   * pick — a bright lower third that looks fine bare turns white text to
   * mush.  So the preview carries the app's own scrim (0 → .15 at half →
   * .65), its label, both languages with the divider between them, and the
   * button, in the app's sizes.
   *
   * SIZED FROM THE PREVIEW'S WIDTH, not in px.  The app's numbers are points
   * on a 362pt card;  a grid tile here is anywhere from 280 to 500px wide,
   * and the rail tile 270.  --u is one of those points at this tile's width
   * (a container query unit), so 18 * var(--u) is the app's 18pt wherever
   * the tile lands, and the text covers the same share of the photo it
   * covers on the phone.  That share is what you are judging. */
  .ph{position:relative;container-type:inline-size;aspect-ratio:var(--votd-crop);
      overflow:hidden;background:var(--line);--u:calc(100cqw / 362)}
  .ph img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
      padding:calc(22 * var(--u));color:#fff;pointer-events:none;text-align:left;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
      background:linear-gradient(rgba(0,0,0,0) 0%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.65) 100%)}
  body.noverse .ov{display:none}
  .ov .lab{font-size:calc(12 * var(--u));font-weight:500;letter-spacing:calc(1.2 * var(--u));
           color:rgba(255,255,255,.78);margin-bottom:calc(8 * var(--u))}
  .ov .ref{font-size:calc(13 * var(--u));font-weight:500;color:rgba(255,255,255,.9);
           margin-bottom:calc(4 * var(--u))}
  .ov .txt{font-size:calc(18 * var(--u));line-height:calc(30 * var(--u));font-weight:400;
           margin-bottom:calc(8 * var(--u))}
  .ov .txt.sec{font-size:calc(15 * var(--u));opacity:.85}
  .ov .div{height:1px;background:rgba(255,255,255,.2);margin:calc(10 * var(--u)) 0}
  .ov .btn{align-self:flex-start;margin-top:calc(14 * var(--u));
           padding:calc(9 * var(--u)) calc(16 * var(--u));border-radius:calc(8 * var(--u));
           border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);
           font-size:calc(12 * var(--u));font-weight:600;letter-spacing:calc(.2 * var(--u))}
  .meta{padding:9px 11px;font-size:12px;color:var(--dim);flex:1;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row{display:flex;gap:8px;padding:0 11px 11px}
  button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
         padding:7px 12px;cursor:pointer;background:var(--panel);color:var(--ink)}
  button.add{background:var(--accent);color:var(--bg);border-color:var(--accent);flex:1;font-weight:560}
  button.x{color:var(--danger);width:42px;flex:none}
  button:disabled{opacity:.5;cursor:default}
  /* Filter chips under a photo.  Small and quiet: the photo is the thing,
     the chips are how it is adjusted.  The active one inverts. */
  .fx{display:flex;flex-wrap:wrap;gap:5px;padding:0 11px 9px}
  .fx button{font-size:11px;padding:3px 9px;border-radius:999px;line-height:1.3}
  .fx button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .live .fx{padding:0 0 10px}
  /* The tile's buttons run full width;  its chips must not. */
  .live .fx button{width:auto}

  /* The review tab is a single column, wide enough to judge a photo on a
     desktop but not a full-width banner. */
  aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
        max-width:560px;margin:0 auto}
  aside h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .q{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);
     cursor:grab;background:var(--panel)}
  .q:last-child{border-bottom:0}
  .q.drag{opacity:.4;cursor:grabbing}
  .q.over{border-top:2px solid var(--accent)}
  .q img{width:52px;aspect-ratio:var(--votd-crop);object-fit:cover;border-radius:5px;flex:none;background:var(--line);
         cursor:zoom-in}
  .q .t{flex:1;font-size:12px;line-height:1.35;overflow:hidden;pointer-events:none;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .q .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px;width:15px;flex:none;
        pointer-events:none}
  .q button{padding:1px 5px;font-size:11px;color:var(--dim);line-height:1.2}
  .hint{font-size:11px;color:var(--dim);margin:0 0 8px}
  .live .ph{border-radius:8px}
  .live img{width:100%;aspect-ratio:var(--votd-crop);object-fit:cover;border-radius:8px;display:block;
            background:var(--line);cursor:zoom-in}
  .live .cap{font-size:12px;color:var(--dim);margin:8px 0 10px;line-height:1.4}
  .live button{width:100%}
  .live button.undo{margin-top:6px;color:var(--dim)}
  aside h2 + h2, .live + h2{margin-top:18px}
  /* Why the board is short.  The worker has always returned `short`
     and `error` for exactly this, but the page used to drop them, so a
     spent Unsplash quota was indistinguishable from a thin harvest —
     the board just showed fewer photos with each pick and said nothing. */
  .warn{font-size:12px;line-height:1.45;color:#8a5a00;background:#fff6e0;
        border:1px solid #f0d9a0;border-radius:8px;padding:8px 10px;margin:8px 0 0}

  /* Sized in viewport UNITS, not inset:0.
   *
   * inset:0 sizes a fixed element against its fixed containing block, and on
   * iOS that came back about 60% of the screen tall — the overlay dimmed the
   * top of the screen and the live page carried on underneath it, tappable.
   * 100dvh is resolved against the viewport itself rather than that block, so
   * it does not inherit the same wrong number;  100vh is the fallback for
   * anything without dvh, and is declared first so dvh wins where supported. */
  #lb{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;
      background:rgba(0,0,0,.86);display:none;z-index:50;overscroll-behavior:contain;
      align-items:center;justify-content:center;padding:24px 24px 56px;cursor:zoom-out}
  #lb.on{display:flex}
  /* Tapping anywhere closes, and always did — but nothing on screen said so,
     so the lightbox read as a thing with no way out.  The button is the
     affordance;  it shares the same handler as the backdrop. */
  #lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;
         width:40px;height:40px;padding:0;border:0;border-radius:20px;font-size:17px;
         background:rgba(255,255,255,.16);color:#fff;line-height:1;
         display:flex;align-items:center;justify-content:center}
  /* Deliberately NOT cropped to --votd-crop.  The grid and the rail answer
     "what will the reader see";  the lightbox answers "what is this photo",
     which is the question you ask when the crop looks wrong and you want to
     know whether the subject is simply outside it. */
  /* 100% of the padded box, so the photo cannot grow past the overlay however
     tall the viewport is reported to be — the bottom padding is the caption's. */
  #lb img{max-width:100%;max-height:100%;border-radius:10px;display:block}
  .reportbtn{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;margin-left:8px}
  .report{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
  .report h3{font-size:13px;margin:14px 0 6px}
  .report table{border-collapse:collapse;width:100%;max-width:520px}
  .report td,.report th{padding:3px 8px 3px 0;text-align:left;font-weight:400;white-space:nowrap}
  .report th{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .report .bad{color:#c0392b}
  .report .good{color:#1e8449}
  .report .hint{color:#888;max-width:520px;white-space:normal;line-height:1.5}
  #lb .cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;
           color:#fff;font-size:13px;opacity:.85;padding:0 24px}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .msg{padding:22px;color:var(--dim)}
  .err{color:var(--danger)}
</style>
</head>
<body>
<header>
  <h1>VOTD picker</h1>
  <span class="stats" id="stats"></span>
  <button class="reportbtn" id="reportBtn" type="button">Why am I blocking?</button>
  <button class="reportbtn" id="ovBtn" type="button">Hide verse</button>
  <div class="warn" id="warn" hidden></div>
</header>
<!-- The report reads the used and blocked lists together and shows only where
     they disagree.  Collapsed by default: it is a thing you open when the board
     feels wrong, not part of picking a photo. -->
<div class="report" id="report" hidden></div>
<div id="boot" class="msg">Loading…</div>
<div id="lb"><button class="x" type="button" aria-label="Close">✕</button><img alt=""><div class="cap"></div></div>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-tab="pick">Pick photos</button>
  <button type="button" data-tab="review">Today · Tomorrow · Queue <span id="qtab"></span></button>
</nav>
<div class="wrap" id="wrap" hidden>
  <main id="tab-pick"><div class="grid" id="grid"></div></main>
  <aside id="tab-review">
    <!-- The photo readers are looking at RIGHT NOW, and the button to replace
         it.  The queue below decides FUTURE days;  until this existed there
         was no way to change the one already on screen, which is the only one
         you ever see and therefore the only one you ever want to change. -->
    <h2>On screen now</h2>
    <div id="live" class="live"><div class="empty">Loading…</div></div>
    <!-- Where the top of the queue WENT.  Staging takes the head of the queue
         at 08:00 UTC and writes it under tomorrow's date, and until this tile
         existed the picker showed neither the taking nor the result — the
         queue just lost its first row overnight, which read as the app
         skipping photos rather than using them.  This is /votd/next, the
         same read the app's warm-up does. -->
    <h2>Tomorrow</h2>
    <div id="next" class="live"><div class="empty">Loading…</div></div>
    <h2>Queue — <span id="qn">0</span></h2>
    <div id="queue"></div>
  </aside>
</div>

<script>
const WORKER = 'https://krengbible.pauljkim22.workers.dev';
const KEY = 'krengbible_admin_secret';

function secret(){
  let s = localStorage.getItem(KEY);
  if(!s){
    s = prompt('Admin secret');
    if(s) localStorage.setItem(KEY, s.trim());
  }
  return (s || '').trim();
}

// The worker answers every refusal with {"error":"..."} saying which one it
// was.  Reading only the status code turned that into "Worker 400", which
// names no cause and suggests no fix.  Translate the ones the worker can
// actually send;  fall back to its own text, and only then to the number.
const CALL_ERRORS = {
  'unknown slug': 'That photo is not on the board any more — it was staged, ' +
                  'used, or removed since this page loaded.',
  'bad action':   'The page asked the worker for something it does not support.',
};
// A stale view can't be fixed by retrying, only by re-reading the board — so
// these reload instead of leaving a dead page behind an alert.
const STALE = new Set([400, 409]);

async function call(path){
  const r = await fetch(WORKER + path, { headers: { 'X-Admin-Secret': secret() } });
  if(r.status === 403){
    localStorage.removeItem(KEY);          // wrong secret — don't keep re-sending it
    throw new Error('Rejected. Reload and re-enter the secret.');
  }
  let body = null;
  try { body = await r.json(); } catch { /* non-JSON error page — fall through */ }
  if(!r.ok){
    const why = (body && body.error) || '';
    const err = new Error(CALL_ERRORS[why] || why || ('Worker ' + r.status));
    err.stale = STALE.has(r.status);
    throw err;
  }
  return body;
}

/* The sample verse the previews carry.  One fixed verse, not today's: the
 * point is a typical length in both languages over EVERY photo, so tiles
 * compare like for like.  John 3:16 is on the long side of the daily verse,
 * which is the side worth checking — a photo that carries it carries most. */
const SAMPLE = {
  label: '오늘의 말씀 · Verse of the Day',
  koRef: '요한복음 3:16',
  ko: '하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라',
  enRef: 'John 3:16',
  en: 'For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life.',
  cta: '요한복음 3장 읽기  →',
};

/* A photo with a verse laid over it, the way the app lays it.  Everything
 * the app puts on the card is here in the app's order: label, Korean,
 * divider, English (secondary size), button.
 *
 * The grid uses SAMPLE, so its tiles compare like for like.  The two live
 * tiles pass the day's REAL verse (see verseFor), so "on screen now" is what
 * readers are looking at and "tomorrow" is what they will be. */
function photoTile(src, verse){
  const v = verse || SAMPLE;
  return '<div class="ph"><img loading="lazy" src="' + src + '" alt="">' +
    '<div class="ov">' +
      '<div class="lab">' + esc(v.label) + '</div>' +
      '<div class="ref">' + esc(v.koRef) + '</div>' +
      '<div class="txt">' + esc(v.ko) + '</div>' +
      '<div class="div"></div>' +
      '<div class="ref">' + esc(v.enRef) + '</div>' +
      '<div class="txt sec">' + esc(v.en) + '</div>' +
      '<div class="btn">' + esc(v.cta) + '</div>' +
    '</div></div>';
}

/* The overlay text for a real day, from a /votd payload.  The worker sends
 * the verse's 개역개정 and ESV text and the Korean book name with the first
 * verse;  an older payload without them falls back to the sample so the
 * tile still shows the card's shape. */
function verseFor(body){
  const v = body && body.verses && body.verses[0];
  if(!v || !(v.ko || v.en)) return null;
  const bookKo = v.bookKo || v.bookname;
  return {
    label: SAMPLE.label,
    koRef: bookKo + ' ' + v.chapter + ':' + v.verse,
    ko: v.ko || '',
    enRef: v.bookname + ' ' + v.chapter + ':' + v.verse,
    en: v.en || '',
    cta: bookKo + ' ' + v.chapter + '장 읽기  →',
  };
}

/* Photo filters.  Unsplash serves through imgix, so a filter is URL
 * parameters on the photo's own URL — the preview here IS the bytes the app
 * will load, and the app needs no code for it.  The same table lives in the
 * worker (VOTD_FILTERS), which is what actually writes the queued and staged
 * URLs;  this copy is for previewing before a choice is sent. */
/* Bright-leaning by design — see VOTD_FILTERS in worker/index.js.  Kept in
   step with it by hand;  the worker is the one that validates a name, so an
   extra chip here would simply be refused. */
const FILTERS = [
  ['original', '원본'], ['vivid', 'Vivid'], ['bright', 'Bright'],
  ['pop', 'Pop'], ['airy', 'Airy'], ['sunny', 'Sunny'],
];
const FILTER_PARAMS = {
  original: '', vivid: 'sat=30&con=8', bright: 'bri=14&con=4',
  pop: 'vib=45&sat=12&con=10', airy: 'bri=18&con=-6&sat=10',
  sunny: 'exp=12&sat=18&bri=6',
};
function filterUrl(url, name){
  const params = FILTER_PARAMS[name];
  if(params == null) return url;
  const clean = String(url).replace(/[?&](sat|con|bri|sepia|exp|hue|vib)=[^&]*/g, (m) => (m[0] === '?' ? '?' : ''))
    .replace(/\?&/, '?').replace(/[?&]$/, '');
  if(!params) return clean;
  return clean + (clean.includes('?') ? '&' : '?') + params;
}
/* A chip row.  `active` names the chip that is on;  `onPick` gets the name. */
function filterRow(active, onPick){
  const row = document.createElement('div');
  row.className = 'fx';
  for(const [name, label] of FILTERS){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if(name === (active || 'original')) b.classList.add('on');
    b.onclick = () => {
      [...row.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      onPick(name);
    };
    row.appendChild(b);
  }
  return row;
}

/* Which tab is open, remembered on this device.  "pick" is the board;
 * "review" is today, tomorrow and the queue. */
const TAB_KEY = 'krengbible_votd_tab';
function showTab(name){
  if(name !== 'review') name = 'pick';
  document.getElementById('tab-pick').hidden = name !== 'pick';
  document.getElementById('tab-review').hidden = name !== 'review';
  for(const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.tab === name);
  localStorage.setItem(TAB_KEY, name);
  window.scrollTo(0, 0);
}
for(const b of document.querySelectorAll('#tabs button')) b.addEventListener('click', () => showTab(b.dataset.tab));

/* Overlay on or off, remembered on this device.  On by default: the bare
 * photo is the less useful view, and it is one click away. */
const OV_KEY = 'krengbible_votd_overlay';
function applyOverlay(){
  const on = localStorage.getItem(OV_KEY) !== 'off';
  document.body.classList.toggle('noverse', !on);
  document.getElementById('ovBtn').textContent = on ? 'Hide verse' : 'Show verse';
}
document.getElementById('ovBtn').addEventListener('click', () => {
  localStorage.setItem(OV_KEY, localStorage.getItem(OV_KEY) === 'off' ? 'on' : 'off');
  applyOverlay();
});
applyOverlay();

// Ask Unsplash for a bigger rendition than the stored url carries.  The saved
// url is w=1080; the grid shows these at ~300–500px CSS, so w=900 keeps them
// crisp on a 2x display without pulling full-size originals for ten photos.
const big = (u, w) => String(u).replace(/&w=\d+/, '&w=' + w);

function render(b){
  document.getElementById('boot').hidden = true;
  document.getElementById('wrap').hidden = false;
  document.getElementById('tabs').hidden = false;
  showTab(localStorage.getItem(TAB_KEY) || 'pick');
  document.getElementById('stats').textContent =
    b.candidates.length + ' shown · ' + b.queue.length + ' queued · ' +
    b.usedCount + ' used · ' + b.rejectedCount + ' blocked';

  // Say WHY when the board comes back short, instead of quietly showing less.
  const warn = document.getElementById('warn');
  const why = {
    'rate-limit': 'Unsplash hourly request limit reached. The bench refills by itself once the hour rolls over — picking still works from whatever is on it.',
    'no-key':     'VOTD_UNSPLASH_KEY is not set on the worker, so no new photos can be fetched at all.',
    'forbidden':  'Unsplash rejected the API key. Check VOTD_UNSPLASH_KEY.',
    'network':    'Could not reach Unsplash. Usually transient — try again shortly.',
    'bad-json':   'Unsplash returned something unreadable. Usually transient.',
  };
  if(b.error){
    warn.hidden = false;
    warn.textContent = why[b.error] || ('Unsplash fetch failed (' + b.error + ').');
  } else if(b.short){
    warn.hidden = false;
    warn.textContent = 'Fewer than ten matched the filters this round (no people, nothing gloomy, dark, man-made, Unsplash+, or already seen). Nothing is broken — reload for another draw.';
  } else {
    warn.hidden = true;
    warn.textContent = '';
  }

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(const c of b.candidates){
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      photoTile(big(c.url, 900)) +
      '<div class="meta">' + (c.alt || 'Untitled') + ' — ' + (c.credit || 'Unknown') + '</div>' +
      '<div class="row"><button class="add">Add to queue</button><button class="x" title="Never show this photo">✕</button></div>';
    // The filter chosen here previews on the tile and goes with the photo
    // when it is queued.  Chosen per card;  the board does not remember it.
    let filter = 'original';
    const img = el.querySelector('img');
    el.insertBefore(filterRow(filter, (name) => {
      filter = name;
      img.src = big(filterUrl(c.url, name), 900);
    }), el.querySelector('.row'));
    el.querySelector('.add').onclick = () => act(el, 'queue', c.slug, filter);
    el.querySelector('.x').onclick   = () => act(el, 'reject', c.slug);
    grid.appendChild(el);
  }

  const q = document.getElementById('queue');
  document.getElementById('qn').textContent = b.queue.length;
  document.getElementById('qtab').textContent = '(' + b.queue.length + ')';
  q.innerHTML = '';
  if(!b.queue.length){ q.innerHTML = '<div class="empty">Empty — the next staging at 08:00 UTC will auto-roll.</div>'; return; }
  order = b.queue.map(x => x.slug);
  // Inside #queue, not before it — render() clears this container on every
  // action, and a sibling would stack up one copy per click.
  if(b.queue.length > 1){
    q.innerHTML = '<p class="hint">Drag to reorder. The top row is taken at 08:00 UTC (04:00 ET) and becomes Tomorrow. Click a thumbnail to enlarge.</p>';
  }
  b.queue.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'q';
    el.draggable = true;
    el.dataset.slug = item.slug;
    el.innerHTML =
      '<span class="n">' + (i + 1) + '</span>' +
      '<img src="' + big(item.url, 200) + '" alt="">' +
      '<span class="t">' + (item.alt || 'Untitled') +
        (item.filter && item.filter !== 'original' ? ' · ' + esc(item.filter) : '') + '</span>' +
      '<button class="rm" title="Remove from queue">✕</button>';
    el.querySelector('.rm').onclick = () => act(el, 'unqueue', item.slug);
    // An <img> is natively draggable and would hijack the row's drag with an
    // image drag of its own, so it opts out — the row still starts the drag
    // because the event bubbles to the draggable parent.  That leaves the
    // image free to take a click for the lightbox.
    const thumbEl = el.querySelector('img');
    thumbEl.draggable = false;
    thumbEl.onclick = (e) => { e.stopPropagation(); lightbox(item); };
    el.ondragstart = (e) => {
      dragging = item.slug;
      el.classList.add('drag');
      e.dataTransfer.effectAllowed = 'move';
      // Required: Firefox (and others) refuse to start a drag at all unless
      // the payload is set.  Its absence is why dragging did nothing while
      // the ▲▼ buttons worked.
      e.dataTransfer.setData('text/plain', item.slug);
    };
    el.ondragend   = () => { dragging = null; el.classList.remove('drag');
                             [...q.children].forEach(c => c.classList.remove('over')); };
    el.ondragover  = (e) => { e.preventDefault(); if(item.slug !== dragging) el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop      = (e) => { e.preventDefault(); el.classList.remove('over');
                              if(dragging && dragging !== item.slug) moveTo(dragging, item.slug); };
    q.appendChild(el);
  });
}

// Full-size view for a queued photo — the 52px rail thumbnail is a locator,
// not something you can judge a photo by.  Pulls w=1600 rather than reusing
// the thumb, so enlarging actually shows more detail.
function lightbox(item){
  const lb = document.getElementById('lb');
  lb.querySelector('img').src = big(item.url, 1600);
  lb.querySelector('.cap').textContent =
    (item.alt || 'Untitled') + ' — ' + (item.credit || 'Unknown');
  lb.classList.add('on');
  // Without this the board scrolls under the overlay, so closing it drops you
  // somewhere other than the row you opened.
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lb').classList.remove('on');
  document.body.style.overflow = '';
}
// One handler for the backdrop, the image and the button alike — the button
// needs no listener of its own, the click reaches here either way.
document.getElementById('lb').onclick = closeLightbox;
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

// Reordering sends the WHOLE new order, which the worker accepts only if it is
// a permutation of what is currently queued — so a stale tab gets a 409 and a
// reload rather than silently rewriting the queue.
let order = [];
let dragging = null;

function commit(next){
  const el = document.getElementById('queue');
  el.style.opacity = '.5';
  call('/admin/votd-act?action=reorder&slugs=' + next.map(encodeURIComponent).join(','))
    .then(render)
    .catch(e => { alert(e.message); location.reload(); })
    .finally(() => { el.style.opacity = ''; });
}
function moveTo(slug, beforeSlug){
  const next = order.filter(s => s !== slug);
  next.splice(next.indexOf(beforeSlug), 0, slug);
  commit(next);
}

async function act(el, action, slug, filter){
  el.classList.add('busy');
  const q = '/admin/votd-act?action=' + action + '&slug=' + encodeURIComponent(slug) +
    (filter ? '&filter=' + encodeURIComponent(filter) : '');
  try{ render(await call(q)); }
  catch(e){
    el.classList.remove('busy');
    alert(e.stale ? e.message + '\n\nReloading the board.' : e.message);
    if(e.stale) location.reload();
  }
}

/**
 * The date key behind the photo on THIS device's screen.
 *
 * NOT COMPUTED HERE.  The worker echoes the key it actually served as `date`
 * on the /votd response, and that is what this page captions and what its
 * re-roll aims at.
 *
 * It used to restate the app's own expression instead — a copy of
 * votdOnce.ts's arithmetic, living in a different repository with nothing
 * linking the two.  The app changed which date it asks for and this page kept
 * the old rule, so "on screen now" showed yesterday beside an app showing
 * today, and "Change this photo" re-rolled a day nobody was looking at.
 *
 * A copy could only ever be right until the original moved.  The response
 * cannot be wrong about itself: the worker's clamp can refuse a date, and a
 * dated request whose verse is missing falls back to the current ET one, so
 * even a correct guess here could differ from what was served.
 *
 * The request still carries this device's own calendar date, which is what the
 * app sends too — but that is now the only thing shared, and it is not a rule
 * about verses, just what day it is on this phone.
 */
const localDayIso = (d = new Date()) =>
  d.getFullYear() + '-' +
  String(d.getMonth() + 1).padStart(2, '0') + '-' +
  String(d.getDate()).padStart(2, '0');

/**
 * /votd is public, so this needs no secret — only the re-roll does.
 *
 * It does need to defeat caching, though, and belt-and-braces because this is
 * the one read that must never be stale: it runs immediately after a re-roll,
 * to show what the re-roll produced.  /votd sends a public max-age (short for
 * a re-rollable date, but not zero), so without this the panel re-read the
 * photo it had just replaced and looked like the button had done nothing.
 *
 * cache:'no-store' is the correct instruction;  the `_` param is the one that
 * works everywhere, since a URL nothing has seen cannot be answered from a
 * cache at all.  Unknown query params are ignored by the route, which reads
 * only `date`.
 */
async function renderLive(){
  // What we ASK for.  What we were SERVED comes back in the response, and the
  // two can differ — see the comment above localDayIso.
  const asked = localDayIso();
  const el = document.getElementById('live');
  let photo = null, date = asked, verse = null;
  try{
    const r = await fetch(
      WORKER + '/votd?date=' + encodeURIComponent(asked) + '&_=' + Date.now(),
      { cache: 'no-store' }
    );
    if(r.ok){
      const body = await r.json();
      photo = body.photo;
      verse = verseFor(body);
      // Older workers do not send it;  falling back to what we asked for is
      // what this page did before, so an un-deployed worker is no worse.
      if(body.date) date = body.date;
    }
  }catch(e){ /* falls through to the no-photo caption below */ }

  el.textContent = '';
  if(photo && photo.url){
    el.insertAdjacentHTML('beforeend', photoTile(big(photo.url, 640), verse));
    el.querySelector('img').onclick = () => lightbox(photo);
  }
  const cap = document.createElement('p');
  cap.className = 'cap';
  cap.textContent = photo
    ? (photo.credit || 'Unknown') + ' · this device is being served ' + date
    : 'No photo stored for ' + date + ' — readers see a tinted card.';
  el.appendChild(cap);
  // No filter chips here:  phones store today's photo at first open and
  // the edge caches /votd until midnight, so a change now reaches almost
  // nobody.  Tomorrow's tile is where a filter belongs.

  const btn = document.createElement('button');
  btn.className = 'add';
  btn.textContent = photo ? 'Change this photo' : 'Roll a photo';
  btn.onclick = () => reroll(btn, date);
  el.appendChild(btn);
  await undoButton(el, date, [renderLive]);
}

/**
 * What is staged for TOMORROW — the ET date the 08:00 UTC cron writes, which
 * is also the date the worker's /votd/next reports.  Public read, no secret.
 *
 * `staged:false` before 08:00 UTC is normal: the cron has not run yet and
 * the top of the queue is still in the queue.  After 08:00 UTC it means
 * every roll failed and midnight will roll on first request instead.
 *
 * Same no-store belt-and-braces as renderLive, for the same reason: this
 * runs straight after a re-roll and must show what the re-roll produced.
 */
async function renderNext(){
  const el = document.getElementById('next');
  let photo = null, date = null, staged = false, verse = null;
  try{
    const r = await fetch(WORKER + '/votd/next?_=' + Date.now(), { cache: 'no-store' });
    if(r.ok){
      const body = await r.json();
      photo = body.photo; date = body.date; staged = !!body.staged;
    }
    // Tomorrow's VERSE, by the date /votd/next names.  Written at 09:00 UTC;
    // before that the worker answers for today instead, which the echoed
    // date reveals, and the tile keeps the sample rather than showing
    // today's verse as tomorrow's.
    if(date){
      const rv = await fetch(WORKER + '/votd?date=' + encodeURIComponent(date) + '&_=' + Date.now(), { cache: 'no-store' });
      if(rv.ok){
        const vb = await rv.json();
        if(vb.date === date) verse = verseFor(vb);
      }
    }
  }catch(e){ /* falls through to the not-staged caption below */ }

  el.textContent = '';
  if(!date){
    el.innerHTML = '<div class="empty">Could not read /votd/next.</div>';
    return;
  }
  if(photo && photo.url){
    el.insertAdjacentHTML('beforeend', photoTile(big(photo.url, 640), verse));
    el.querySelector('img').onclick = () => lightbox(photo);
  }
  const cap = document.createElement('p');
  cap.className = 'cap';
  cap.textContent = staged
    ? (photo ? (photo.credit || 'Unknown') + ' · staged for ' + date
             : 'Staged for ' + date + ' but unreadable — roll again.')
    : 'Nothing staged yet for ' + date + '. The top of the queue is taken at 08:00 UTC (04:00 ET); until then it stays in the queue.';
  el.appendChild(cap);
  if(photo && photo.url) el.appendChild(filterRow(photo.filter, (name) => refilter(el, date, name, renderNext)));

  const btn = document.createElement('button');
  btn.className = 'add';
  btn.textContent = staged ? 'Change tomorrow\'s photo' : 'Stage now from the queue';
  btn.onclick = () => reroll(btn, date, [renderNext]);
  el.appendChild(btn);
  await undoButton(el, date, [renderNext]);
}

/* "Undo", shown only when the worker holds a photo to go back to for this
 * date — the one staged before the last re-roll.  Filter changes do not
 * count;  the chips reverse those.  One step:  pressing it clears what it
 * restored from, so it never offers a second undo that would mean
 * something else.  A re-rolled photo that came from the queue goes back to
 * the head of the queue, which is why the board is re-read afterwards. */
async function undoButton(el, date, after){
  let peek = null;
  try{ peek = await call('/admin/votd-undo?date=' + encodeURIComponent(date) + '&peek=1'); }
  catch(e){ return; }
  if(!peek || !peek.has) return;
  const btn = document.createElement('button');
  btn.className = 'undo';
  btn.textContent = peek.photo
    ? 'Undo · back to ' + (peek.photo.credit || 'the previous photo') + (peek.photo.filter && peek.photo.filter !== 'original' ? ' (' + peek.photo.filter + ')' : '')
    : 'Undo · un-stage this date';
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = 'Undoing…';
    try{
      await call('/admin/votd-undo?date=' + encodeURIComponent(date));
      await Promise.all(after.map((f) => f()));
      render(await call('/admin/votd-board'));
    }catch(e){
      btn.disabled = false;
      btn.textContent = 'Undo';
      alert(e.message);
    }
  };
  el.appendChild(btn);
}

/* Change the filter on a STAGED photo, live or tomorrow's.  Rewrites the
 * stored record for that date with the same photo and the new parameters,
 * then redraws the tile from what the worker now holds. */
async function refilter(el, date, name, redraw){
  el.style.opacity = '.5';
  try{
    await call('/admin/votd-filter?date=' + encodeURIComponent(date) + '&filter=' + encodeURIComponent(name));
    await redraw();
  }catch(e){
    alert(e.message);
  }finally{
    el.style.opacity = '';
  }
}

/**
 * Re-roll a date.  Takes the head of the queue when one is waiting,
 * otherwise rolls fresh — same path the 08:00 UTC cron uses, so what you get
 * here is what the cron would have staged.
 *
 * `after` is which tile(s) to redraw — the live one, tomorrow's, or both.
 * The board is re-fetched afterwards because a queued photo that gets staged
 * is REMOVED from the queue, and a stale rail would still show it waiting.
 */
async function reroll(btn, date, after = [renderLive]){
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Rolling…';
  try{
    const r = await call('/admin/votd-next?date=' + encodeURIComponent(date));
    if(!r.staged){
      throw new Error('Every roll came back unusable just now — people shots, too dark, or Unsplash+. Nothing was changed. Try again.');
    }
    await Promise.all(after.map((f) => f()));
    render(await call('/admin/votd-board'));
  }catch(e){
    btn.disabled = false;
    btn.textContent = label;
    alert(e.message);
  }
}

/* Captions and photographer names come from Unsplash, so they are somebody
 * else's text going into innerHTML.  Escaped rather than trusted. */
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---- The report: what the blocked pile is actually saying ----
 *
 * Both lists already existed and were used for one thing, never showing the
 * same photo twice.  That stops repeats and teaches nothing, so a search that
 * yields junk goes on yielding it and only the blocklist grows.
 *
 * What is worth reading is where the two piles DISAGREE.  A word in half of
 * each says nothing.  A word in nine blocked photos and no kept ones is a
 * keyword worth adding to the worker's reject list;  a topic blocked four
 * times in five is a line worth deleting from VOTD_TOPICS.  So rows are shown
 * with both counts side by side, and the ones that decide nothing are simply
 * not shown — terms below the minimum are dropped worker-side.
 */
function reportTable(title, rows, hint){
  if(!rows || !rows.length) return '';
  const pct = (r) => Math.round(r.rate * 100);
  // Colour only at the ends.  A 100% blocked term is actionable and a 0% one
  // is a keeper;  the middle is genuinely undecided and should not be dressed
  // up as though it were a finding.
  const cls = (r) => (r.rate >= 0.8 ? 'bad' : r.rate <= 0.2 ? 'good' : '');
  return '<h3>' + title + '</h3>' +
    (hint ? '<div class="hint">' + hint + '</div>' : '') +
    '<table><tr><th>term</th><th>blocked</th><th>kept</th><th>blocked %</th></tr>' +
    rows.map((r) =>
      '<tr><td>' + esc(r.term) + '</td><td>' + r.blocked + '</td><td>' + r.kept +
      '</td><td class="' + cls(r) + '">' + pct(r) + '%</td></tr>').join('') +
    '</table>';
}

async function showReport(btn){
  const panel = document.getElementById('report');
  if(!panel.hidden){ panel.hidden = true; btn.textContent = 'Why am I blocking?'; return; }
  btn.disabled = true;
  btn.textContent = 'Reading…';
  try{
    const d = await call('/admin/votd-photo-report');
    const t = d.totals;
    panel.innerHTML =
      '<div><strong>' + t.kept + ' kept · ' + t.blocked + ' blocked</strong> — ' +
      Math.round(t.blockRate * 100) + '% of everything you have judged was blocked.</div>' +
      reportTable('Words', d.words,
        'Words from the photo captions. A word blocked nearly every time is worth adding to the worker\'s reject keywords, which stops those photos reaching the board at all.') +
      reportTable('Photographers', d.photographers,
        'Someone blocked every time is a style the card does not suit — which no keyword will catch.') +
      (d.topics && d.topics.length
        ? reportTable('Search topics', d.topics,
            'The Unsplash searches the photos came from. A topic blocked most of the time is a line to drop from VOTD_TOPICS.')
        : '<h3>Search topics</h3><div class="hint">' + esc(d.note || '') + '</div>');
    panel.hidden = false;
    btn.textContent = 'Hide';
  }catch(e){
    alert(e.message);
    btn.textContent = 'Why am I blocking?';
  }finally{
    btn.disabled = false;
  }
}
document.getElementById('reportBtn').addEventListener('click', (e) => showReport(e.currentTarget));

(async () => {
  try{
    render(await call('/admin/votd-board'));
    renderLive();
    renderNext();
  }
  catch(e){ document.getElementById('boot').innerHTML = '<span class="err">' + e.message + '</span>'; }
})();
</script>
</body>
</html>
